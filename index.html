                                        <Section title="Selecting Words: Concrete vs. Abstract" icon={Feather} color="indigo">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p><strong>Abstract words</strong> name general concepts that don't immediately point to something we can experience with our senses (e.g., <em>Freedom, love, patriotism</em>). Used carefully, they motivate powerful responses; overused, they leave writing vague.</p>
                                                <p><strong>Concrete words</strong> evoke precise, vivid mental images. A thing is concrete if we can weigh it, hold it, or photograph it. They add precision and "juice" to writing.</p>
                                                <p><strong>Specific vs. General:</strong> We must decide how specific to be based on the context. E.g., Animal -> Mammal -> Dog -> Collie -> Lassie. If writing about a rich jet-setter, mentioning he drives a <em>Ferrari</em> (specific) is better than saying he drives a <em>car</em> (general).</p>
                                            </div>
                                            <Ar title="اختيار الكلمات: المجرد والملموس">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>الكلمات المجردة (Abstract):</strong> مفاهيم عامة لا تدرك بالحواس (كالحرية والحب). كثرتها تجعل النص مبهماً.</li>
                                                    <li><strong>الكلمات الملموسة (Concrete):</strong> أشياء دقيقة يمكن لمسها أو رؤيتها. تعطي النص حيوية ودقة.</li>
                                                </ul>
                                                كما يجب التدرج من العام إلى الخاص متى استدعى الأمر. (قولك أن الثري يمتلك "فيراري" أقوى درامياً من قولك يمتلك "سيارة").
                                            </Ar>
                                        </Section>

                                        <Section title="Levels of Diction & Tone" icon={Users} color="indigo">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p>Your audience and purpose dictate your <strong>level of diction</strong>. All college/job writing should be <em>Edited American English</em> (not nonstandard).</p>
                                                <ul className="list-disc pl-5 space-y-2">
                                                    <li><strong>Formal Level:</strong> Serious and dignified. Multisyllabic, abstract words, no slang or contractions. Long, periodic, parallel sentences. (e.g., JFK's Inaugural Address).</li>
                                                    <li><strong>Informal Level:</strong> Intelligent conversation. Ordinary words, loose sentences, contractions, and first-person pronouns (I, you).</li>
                                                    <li><strong>Formal-Informal Level:</strong> A mix commonly used today in articles. Mixes complex structures with relaxed phrasing.</li>
                                                    <li><strong>Technical Level:</strong> For specialists. Uses specialized jargon (e.g., <em>neurotransmitter, presynaptic</em>) and complex sentences but without the poetic parallelism of formal diction.</li>
                                                </ul>
                                                
                                                <p className="mt-4 border-t pt-4"><strong>Denotation vs. Connotation:</strong></p>
                                                <p><strong>Denotation</strong> is the direct, dictionary definition (objective). <strong>Connotation</strong> is the emotional value or association (subjective). Both "cop" and "police officer" denote the same thing, but carry drastically different connotations.</p>
                                                
                                                <p className="mt-2"><strong>Objective Tone:</strong> Keeps the writer's personality out of the message, businesslike and authoritative (used in medical/scientific writing). Other tones can be satiric, serious, or playful depending on persuasive goals.</p>
                                            </div>
                                            <Ar title="مستويات اللغة والنبرة الدلالية">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>المستوى الرسمي (Formal):</strong> كلمات طويلة ومجردة، جمل معقدة، لا يحتوي على اختصارات (يُستخدم في الخطابات السياسية).</li>
                                                    <li><strong>المستوى غير الرسمي (Informal):</strong> كالمحادثات الراقية، كلمات بسيطة، واستخدام ضمائر المتكلم (I, you).</li>
                                                    <li><strong>المستوى التقني (Technical):</strong> موجه للمتخصصين، مليء بالمصطلحات العلمية (Jargon).</li>
                                                </ul>
                                                <br/>
                                                <strong>المعنى الحرفي (Denotation) مقابل الإيحاء (Connotation):</strong> المعنى الحرفي هو تعريف القاموس المجرد. الإيحاء هو المشاعر المرتبطة بالكلمة (مثال: كلمة "شرطي" و"مخبر" لهما نفس المعنى الحرفي لكن إيحاءاتهما مختلفة تماماً).
                                            </Ar>
                                        </Section>

                                        <Section title="Figurative Language & Irony" subtitle="Adding artistic impact" icon={Sparkles} color="indigo">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p>Figurative language uses words non-literally to create sharply etched sensory images.</p>
                                                <ul className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Simile:</strong> Compares unlike things using <em>like</em> or <em>as</em>. (e.g., As restless as an aspen leaf).</li>
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Metaphor:</strong> Compares without like/as. (e.g., The moon was a wind-tossed bark).</li>
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Personification:</strong> Assigns human traits to nonhuman things. (e.g., The vine clung stubbornly).</li>
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Overstatement (Hyperbole):</strong> Deliberate exaggeration to make a point. (e.g., He has 114 offenses out of a possible 115).</li>
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Understatement:</strong> Making an assertion humbly to draw attention to it. (e.g., Calling a 23-2 record "pretty fair").</li>
                                                    <li className="bg-slate-50 p-3 rounded-lg border"><strong>Irony:</strong> Intentionally stating one thing but meaning the opposite.</li>
                                                </ul>
                                            </div>
                                            <Ar title="الصور البلاغية والمفارقة">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>التشبيه (Simile):</strong> مقارنة باستخدام أداة (كـ / مثل).</li>
                                                    <li><strong>الاستعارة (Metaphor):</strong> تشبيه بليغ بدون أدوات.</li>
                                                    <li><strong>التشخيص (Personification):</strong> إعطاء صفات بشرية لجماد.</li>
                                                    <li><strong>المبالغة (Overstatement):</strong> تضخيم الوصف للتأكيد.</li>
                                                    <li><strong>التقليل (Understatement):</strong> التواضع في الوصف لتسليط الضوء بشكل غير مباشر (مثل وصف فريق لا يُهزم بأنه "لا بأس به").</li>
                                                    <li><strong>المفارقة (Irony):</strong> قول عكس المقصود بغرض السخرية أو إيصال رسالة مبطنة.</li>
                                                </ul>
                                            </Ar>
                                        </Section>

                                        <Section title="Eliminating Flawed Diction" icon={XCircle} color="indigo">
                                            <div className="space-y-3 text-sm leading-relaxed text-slate-700">
                                                <p><strong>1. Wordiness (Deadwood & Gobbledygook):</strong> Deadwood takes up space without adding meaning. Gobbledygook uses overly technical/long words to unnecessarily complicate a sentence (e.g., "exhibited a 100% mortality response" -> "All the fish died").</p>
                                                <p><strong>2. Ambiguity:</strong> Sentences that leave the reader guessing the intent (e.g., "killed off his employees" when meaning "fired them").</p>
                                                <p><strong>3. Euphemisms:</strong> Words taking the sting out of reality (e.g., <em>pass away</em> for die). Best avoided unless protecting a sensitive reader; they can obscure horrific reality.</p>
                                                <p><strong>4. Colloquial & Slang:</strong> Informal/arbitrary vocab. Rarely appropriate in formal writing, though occasionally useful in dialogue.</p>
                                                <p><strong>5. Clichés & Mixed Metaphors:</strong> Stale, overused expressions (e.g., <em>green with envy</em>). Mixed metaphors combine two incompatible clichés comically (e.g., "When he opened that can of worms, he bit off more than he could chew").</p>
                                                <p><strong>6. Sexist Language:</strong> Unnecessarily mentioning appearance/spouses, using male pronouns for general subjects, or using gendered job titles (e.g., use <em>Police officer</em>, not Policeman).</p>
                                            </div>
                                            <Ar title="التخلص من الألفاظ المعيبة">
                                                تجنب الآتي في كتاباتك:
                                                <strong>الحشو والكلام المعقد (Wordiness):</strong> الكلمات الميتة والمصطلحات المعقدة التي يمكن استبدالها بكلمة بسيطة. <strong>الغموض (Ambiguity):</strong> الجمل التي تحتمل معنيين وتشتت القارئ. <strong>الكلمات الملطفة (Euphemisms):</strong> تجميل الكلمات القاسية (مثل "تُوفي" بدلاً من "مات")، ويفضل تجنبها لأنها تخفي الحقائق. <strong>العامية (Slang):</strong> ممنوعة في الكتابة الرسمية. <strong>الكليشيهات (Clichés):</strong> التعبيرات المكررة والمستهلكة. <strong>اللغة المتحيزة جنسياً (Sexist Language):</strong> مثل استخدام المذكر للإشارة للجميع، أو تخصيص الوظائف بجنس معين (استخدم إطفائي بدلاً من رجل إطفاء).
                                            </Ar>
                                        </Section>

                                    </div>
                                )}

                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row gap-6 items-center hover:border-rose-200 transition-colors">
                                            <div className="md:w-1/4 flex justify-center">

                                            <div className="md:w-3/4 text-center md:text-left space-y-1">
                                                <h2 className="text-xl font-black text-slate-900">4. Rhetorical Modes</h2>
                                                <p className="text-slate-600 text-sm leading-relaxed">
                                                    Mastering Description, Illustration, and Definition to effectively communicate ideas and boundaries to the reader.
                                                </p>
                                            </div>

                                        <Section title="Description: Presenting Impressions" icon={Image} color="rose">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p>Effective description creates sharply etched word pictures using <strong>sensory impressions</strong> (sight, sound, taste, smell, touch). These build toward a <strong>Dominant Impression</strong>—an overall mood or feeling (e.g., joy, terror, security).</p>
                                                <p><strong>Vantage Point:</strong></p>
                                                <ul className="list-disc pl-5 space-y-1">
                                                    <li><em>Fixed observer:</em> Remains in one place and reports only what can be perceived from there.</li>
                                                    <li><em>Moving observer:</em> Views things from multiple positions (e.g., moving from the sky to the ground), signaled by transition phrases.</li>
                                                </ul>
                                                <p><strong>Selection & Arrangement:</strong> Description depends on exclusion as much as inclusion. Don't list everything; select details that point toward the mood. Arrange them spatially (top to bottom) or temporally.</p>
                                            </div>
                                            <Ar title="الوصف ورسم الانطباعات">
                                                الوصف الفعال يعتمد على <strong>الحواس الخمس</strong> لخلق <strong>انطباع سائد (Dominant Impression)</strong> يعكس حالة مزاجية معينة كالرعب أو الطمأنينة. 
                                                <br/>
                                                يمكن للكاتب الوصف من نقطة <strong>ثابتة</strong> (لا يصف إلا ما يراه من مكانه)، أو نقطة <strong>متحركة</strong>. الأهم في الوصف هو <strong>الاستبعاد</strong>، فلا تذكر كل تفصيلة، بل اختر فقط التفاصيل التي تدعم الحالة المزاجية المرجوة ورتبها مكانياً أو زمانياً.
                                            </Ar>
                                        </Section>

                                        <Section title="Illustration: Clarifying with Examples" icon={LayoutTemplate} color="rose">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p>Illustration clarifies general statements or abstract principles by supplying concrete examples. They must stay on target and display the chief features of the concept.</p>
                                                <p><strong>Number of Examples Needed:</strong></p>
                                                <ul className="list-disc pl-5 space-y-1">
                                                    <li><em>One Long Example:</em> Best for topics where traits are combined in a single object (e.g., the qualities of a successful nurse).</li>
                                                    <li><em>Several Examples:</em> Best for historical trends or broader claims (e.g., changes in parenting over 50 years).</li>
                                                    <li><em>Large Series of Examples:</em> Best for very general claims (e.g., proving Medicare abuse is widespread).</li>
                                                </ul>
                                                <p><strong>Ethical Issues:</strong> Deception occurs when writers deliberately distort examples or choose atypical, extremely negative ones to push a biased agenda (e.g., parents using only starving actors as examples to deter their child).</p>
                                            </div>
                                            <Ar title="التوضيح بضرب الأمثلة (Illustration)">
                                                استخدام الأمثلة يوضح الأفكار المجردة. يختلف عدد الأمثلة حسب الموضوع: <strong>مثال واحد طويل</strong> يكفي لشرح مهنة معينة. <strong>عدة أمثلة</strong> تصلح لشرح تغيرات عبر الزمن. <strong>سلسلة ضخمة من الأمثلة</strong> ضرورية لإثبات ظاهرة عامة.
                                                <br/>
                                                <strong>تحذير أخلاقي:</strong> تجنب التضليل بانتقاء أمثلة شاذة أو متطرفة لتخويف القارئ أو إقناعه برأي متحيز.
                                            </Ar>
                                        </Section>

                                        <Section title="Definition: Establishing Boundaries" icon={BookOpen} color="rose">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p>Defining a term establishes its boundaries, separating it from all others. Abstract terms (democracy) or debated terms (drug pusher) require careful boundaries.</p>
                                                
                                                <h4 className="font-bold text-slate-900 mt-2 mb-1">Types of Definitions:</h4>
                                                <ul className="list-disc pl-5 space-y-2">
                                                    <li><strong>Synonyms:</strong> Words with nearly the same meaning (e.g., <em>lissome</em> = <em>nimble</em>).</li>
                                                    <li><strong>Essential Definitions:</strong> Does three things: (1) Names the item, (2) Places it in a broad category, (3) Distinguishes it from others. <br/><span className="text-slate-500 italic">Example: A vacuum cleaner (item) is a household appliance (category) that uses suction (distinguishing feature).</span></li>
                                                    <li><strong>Extended Definitions:</strong> Paragraphs or pages explaining a complex term, often mixing narration, comparison, and negation.</li>
                                                </ul>

                                                <h4 className="font-bold text-slate-900 mt-4 mb-1">Pitfalls to Avoid:</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                                    <div className="bg-slate-50 p-2 rounded border"><strong>Circular definition:</strong> Defining a term by repeating it ("A psychiatrist practices psychiatry").</div>
                                                    <div className="bg-slate-50 p-2 rounded border"><strong>Overly broad:</strong> Includes too much ("A skunk is a black animal with white fur").</div>
                                                    <div className="bg-slate-50 p-2 rounded border"><strong>Overly narrow:</strong> Excludes valid functions ("A blender chops food" - it also mixes/whips).</div>
                                                    <div className="bg-slate-50 p-2 rounded border"><strong>Omission of category:</strong> Using "is where/when" instead of naming the category ("A bistro is where...").</div>
                                                </div>
                                            </div>
                                            <Ar title="التعريف اللغوي: وضع الحدود">
                                                التعريف يضع حداً فاصلاً للمصطلح. 
                                                <br/><strong>أنواعه:</strong> المترادفات (Synonyms)، التعريف الأساسي (Essential)، والتعريف الممتد (Extended).
                                                <br/><strong>معادلة التعريف الأساسي:</strong> (اسم العنصر) هو (الفئة العامة) التي تتميز بـ (السمة الفريدة). <em>مثال: المكنسة (عنصر) هي جهاز منزلي (فئة) تعمل بالشفط (سمة فريدة).</em>
                                                <br/><strong>أخطاء شائعة:</strong> التعريف الدائري (تكرار نفس الكلمة)، التعريف الواسع جداً (يجمع أشياء أخرى معه)، التعريف الضيق (يحصر الشيء في وظيفة واحدة)، أو عدم ذكر الفئة (قولك: المقهى هو "عندما" نشرب القهوة).
                                            </Ar>
                                        </Section>

                                    </div>
                                )}

                                {/* TAB 5: WRITING ABOUT LITERATURE */}
                                {activeTab === 'dr_abdullah_lit' && (
                                    <div className="space-y-8 animate-in fade-in duration-300">
                                        
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row gap-6 items-center hover:border-purple-200 transition-colors">
                                            <div className="md:w-1/4 flex justify-center">
                                                <div className="w-20 h-20 bg-purple-50 rounded-full flex items-center justify-center border-4 border-white shadow-md text-purple-600">

                                            </div>
                                            <div className="md:w-3/4 text-center md:text-left space-y-1">
                                                <h2 className="text-xl font-black text-slate-900">5. Writing About Creative Works</h2>
                                                <p className="text-slate-600 text-sm leading-relaxed">
                                                    Analyzing literature, movies, and TV shows. Understanding plot, setting, POV, themes, and crafting reviews or literary analyses.
                                                </p>
                                            </div>
                                        </div>

                                        <Section title="Elements of Creative Works (Part 1)" subtitle="Plot, Setting, & Characters" icon={Feather} color="purple">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p><strong>1. Plot:</strong> The series of events that moves the narrative along. Plots use techniques like <strong>Foreshadowing</strong> (hints at future events), <strong>Flashback</strong> (interrupts present action for past events), <strong>Cutting</strong> (skips routine parts), and varying <strong>Order</strong>.</p>
                                                
                                                <p><strong>2. Setting:</strong> The time, place, and environment. Setting creates mood/atmosphere, reveals character traits (e.g., a luxurious house reveals desire for display), acts as a symbol (a river = fate), and supports the theme.</p>
                                                
                                                <p><strong>3. Character:</strong> Individuals who drive the action. Roles include the <strong>Protagonist</strong> (main character, good or bad) and the <strong>Antagonist</strong> (opposed to the protagonist, not necessarily bad). Writers define characters through direct narration, their settings, actions, or dialogue.</p>
                                            </div>
                                            <Ar title="عناصر الأعمال الإبداعية (الجزء الأول)">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>الحبكة (Plot):</strong> تسلسل الأحداث. تستخدم تقنيات كالتلميح المسبق (Foreshadowing)، والاسترجاع (Flashback).</li>
                                                    <li><strong>الزمان والمكان (Setting):</strong> يخلق الحالة المزاجية، يعكس شخصية البطل، ويعمل كرمز للأحداث.</li>
                                                    <li><strong>الشخصيات (Character):</strong> المحرك الأساسي. يشمل البطل (Protagonist) والخصم (Antagonist). الخصم ليس بالضرورة شخصاً شريراً، قد يكون محققاً يطارد بطلاً مجرماً.</li>
                                                </ul>
                                            </Ar>
                                        </Section>

                                        <Section title="Elements of Creative Works (Part 2)" subtitle="POV, Symbols, & Themes" icon={Users} color="purple">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <p><strong>4. Point of View (POV):</strong> The perspective from which a story is told.</p>
                                                <ul className="list-disc pl-5 space-y-1 text-xs">
                                                    <li><em>First-Person (I, me):</em> Direct access to narrator's thoughts, but limited/unreliable.</li>
                                                    <li><em>Third-Person Limited (he, she):</em> Focuses on one character from outside.</li>
                                                    <li><em>Third-Person Omniscient:</em> All-knowing narrator who sees everyone's thoughts.</li>
                                                </ul>

                                                <p><strong>5. Symbols:</strong> Objects/names representing deeper meanings. <em>Unique symbols</em> mean something only in that work (the Mockingjay). <em>Conventional symbols</em> are culturally recognized (a cross). Meaning is gained through repeated association.</p>

                                                <p><strong>6. Theme:</strong> The central message or insight about life. Rarely stated directly; usually inferred from characters, plot, and symbols.</p>

                                                <p><strong>7. Other Devices:</strong></p>
                                                <ul className="list-disc pl-5 space-y-1 text-xs">
                                                    <li><em>Memes:</em> Ideas or images that repeat across culture and time (e.g., Frankenstein).</li>
                                                    <li><em>Ambiguity:</em> Unresolved endings reflecting life's uncertainty.</li>
                                                    <li><em>Juxtaposition:</em> Placing contrasting scenes side-by-side to highlight differences.</li>
                                                    <li><em>Irony:</em> Difference between expectation and outcome (Situational irony).</li>
                                                </ul>
                                            </div>
                                            <Ar title="عناصر الأعمال الإبداعية (الجزء الثاني)">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>وجهة النظر (POV):</strong> منظور سرد القصة. إما بضمير المتكلم (يخلق حميمية لكنه غير موثوق)، أو الغائب المحدود، أو الراوي العليم بكل شيء (Omniscient).</li>
                                                    <li><strong>الرموز (Symbols):</strong> قد تكون فريدة وخاصة بالقصة فقط، أو رموز متعارف عليها ثقافياً.</li>
                                                    <li><strong>الموضوع أو الرسالة (Theme):</strong> الفكرة المركزية العميقة للعمل وتُستنتج من الأحداث.</li>
                                                    <li><strong>أدوات أخرى:</strong> الميمز (أفكار تتناقلها الثقافات كدراكولا)، الغموض (نهايات مفتوحة واقعية)، التجاور (وضع مشهدين متناقضين بجوار بعضهما)، والمفارقة (حدوث عكس المتوقع).</li>
                                                </ul>
                                            </Ar>
                                        </Section>

                                        <Section title="Types of Literary Writing" subtitle="Review, Explication, and Analysis" icon={FileText} color="purple">
                                            <div className="space-y-4 text-sm leading-relaxed text-slate-700">
                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                    <div className="bg-slate-50 p-4 rounded-xl border">
                                                        <h4 className="font-bold text-slate-900 mb-1">1. Review</h4>
                                                        <p className="text-xs text-slate-600">Evaluates the work to help readers decide whether to engage with it. Includes a non-spoiler plot summary, balanced strengths/weaknesses, and a final recommendation.</p>
                                                    </div>
                                                    <div className="bg-slate-50 p-4 rounded-xl border">
                                                        <h4 className="font-bold text-slate-900 mb-1">2. Explication</h4>
                                                        <p className="text-xs text-slate-600">Explains and clarifies a difficult text (often poetry) step-by-step. Breaks down complex images and language to simply show <em>what the text means</em> line by line.</p>
                                                    </div>
                                                    <div className="bg-slate-50 p-4 rounded-xl border">
                                                        <h4 className="font-bold text-slate-900 mb-1">3. Literary Analysis</h4>
                                                        <p className="text-xs text-slate-600">Makes a clear argument or interpretation about the deeper meaning. Argues <em>what the text reveals</em> using symbols, themes, or outside critical sources.</p>
                                                    </div>
                                                </div>
                                                <p className="mt-4 text-xs font-bold text-slate-800">Ethical Issues:</p>
                                                <p className="text-xs text-slate-600">When writing, you must read the entire work, avoid quoting out of context, and prevent distorting events just to promote a personal agenda.</p>
                                            </div>
                                            <Ar title="أنواع الكتابة عن الأعمال الأدبية">
                                                <ul className="list-disc pr-5 mt-2 space-y-1">
                                                    <li><strong>المراجعة (Review):</strong> تقييم العمل لترشيحه للجمهور بذكر ملخص بلا حرق، ومميزات وعيوب.</li>
                                                    <li><strong>التفسير (Explication):</strong> شرح النصوص المعقدة (كالشعر) سطراً بسطر لتوضيح معناها المباشر.</li>
                                                    <li><strong>التحليل الأدبي (Analysis):</strong> بناء حجة أو تفسير لرسالة العمل العميقة باستخدام رموزه وشخصياته. (يجب قراءة العمل كاملاً وعدم اجتزاء النصوص لأغراض غير أخلاقية).</li>
                                                </ul>
                                            </Ar>
                                        </Section>

                                    </div>
                                )}

                                {/* TAB 6: EXERCISES HUB */}
                                {activeTab === 'dr_abdullah_exercises' && (
                                    <div className="space-y-8 animate-in fade-in duration-300">
                                        
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row gap-6 items-center hover:border-emerald-200 transition-colors">
                                            <div className="md:w-1/4 flex justify-center">
                                                <div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center border-4 border-white shadow-md text-emerald-600">
                                                    <PenTool size={32} />
                                                </div>
                                            </div>
                                            <div className="md:w-3/4 text-center md:text-left space-y-1">
                                                <h2 className="text-xl font-black text-slate-900">6. Practice Exercises Hub</h2>
                                                <p className="text-slate-600 text-sm leading-relaxed">
                                                    All paragraph unity, topic sentence, and development exercises provided in Dr. Abdullah's section.
                                                </p>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg mb-3 flex items-center gap-2">
                                                    <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs">Section 1</span> Paragraph Unity
                                                </h3>
                                                <div className="space-y-3">
                                                    <ExerciseCard 
                                                        question="Read the 'Elephant graveyard' paragraph and the 'CD Sales' paragraph. Which lacks unity?"
                                                        answer="The 'CD Sales' paragraph lacks unity. While the Elephant paragraph sticks perfectly to the cruel myth of the graveyard, the CD paragraph jumps from online downloading convenience, to retail bankruptcies (Tower Records), to alternative indie bands getting distribution, and finally to Wal-Mart's impact. It has far too many stray ideas."
                                                        themeColor="amber"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg mb-3 flex items-center gap-2 mt-8">
                                                    <span className="bg-teal-100 text-teal-800 px-2 py-0.5 rounded text-xs">Section 2</span> Finding Topic Sentences
                                                </h3>
                                                <div className="space-y-3">
                                                    <ExerciseCard 
                                                        question="Find the topic sentence: Last winter, while leafing through the Guinness Book... I planted a half acre of sunflower seeds. That half acre is now a magnificent 22,000 square feet... I plan to have an automatic watering system to feed my babies."
                                                        answer="Implied Topic Sentence: There is no explicit topic sentence. The paragraph collectively describes the writer's attempt to grow sunflowers, inspired by a world record, and how they feel about the process."
                                                        themeColor="teal"
                                                    />
                                                    <ExerciseCard 
                                                        question="Find the topic sentence: At the most fundamental level, scientific explanation of the world is akin to the process of reading and writing. Whether studying skull structures or geological layers, scientists were deciphering sign systems..."
                                                        answer="Topic Sentence is Stated First: 'At the most fundamental level, scientific explanation of the world is akin to the process of reading and writing.'"
                                                        themeColor="teal"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg mb-3 flex items-center gap-2 mt-8">
                                                    <span className="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-xs">Section 3</span> Paragraph Development
                                                </h3>
                                                <div className="space-y-3">
                                                    <ExerciseCard 
                                                        question="Expand this underdeveloped unit: 'I like living in a small town because the people are so friendly. In addition, I can always get the latest gossip from the local busybody.'"
                                                        answer="Expanded: Living in a small town has its unique charm, and one of the best aspects is how friendly the people are. In a small town, you always feel like you're part of a close-knit community... People take the time to greet you, and neighbors stop by to check in. Moreover, the town is full of interesting characters, such as the local busybody, who always seems to know the latest news. Whether it's a new job, a wedding, or neighborhood happenings, you can count on the busybody to keep you in the loop..."
                                                        themeColor="indigo"
                                                    />
                                                    <ExerciseCard 
                                                        question="Expand this underdeveloped unit: 'In a big city, people are afraid to get too friendly. Everything is very private, and nobody knows anything about anybody else.'"
                                                        answer="Expanded: In a big city, people are afraid to get too friendly. It feels like everyone is in their own world, rushing from one place to another. I hardly ever see anyone without their headphones in, avoiding eye contact. The streets are filled with people, yet there's a strange sense of isolation. Even on the packed subway, it's rare to strike up a conversation. The anonymity of city life means personal space is valued above all, and you can live next to someone for years without ever getting to know them..."
                                                        themeColor="indigo"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg mb-3 flex items-center gap-2 mt-8">
                                                    <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded text-xs">Section 4</span> Organization Strategy
                                                </h3>
                                                <div className="space-y-3">
                                                    <ExerciseCard 
                                                        question="What is the writing strategy used here? 'I woke up late that morning and rushed through my routine. I skipped breakfast, grabbed my bag, and ran to the bus stop just as the bus was leaving. At school, I realized I had forgotten my homework... By lunchtime, things got worse...'"
                                                        answer="Strategy: Time Sequence (Narration). It tells a story step by step using a clear chronological timeline: woke up -> ran to bus -> at school -> by lunchtime."
                                                        themeColor="rose"
                                                    />
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                )}
                            </>
                        )}

                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
